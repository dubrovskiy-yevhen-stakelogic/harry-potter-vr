plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.hpvr.quest'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.hpvr.quest'
        minSdk 32
        targetSdk 35
        versionCode 37
        versionName '0.1.0-demo'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                cppFlags '-std=c++20'
            }
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libopenxr_loader.so']
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            // Signing belongs to BUILD-QUEST-RELEASE.ps1, never Gradle secrets.
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.43'
}
