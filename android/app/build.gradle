plugins {
    id 'com.android.application'
}

// Local consented microphone diagnostics are never enabled by a normal build.
def hpvrVoiceDiagnostics = providers.gradleProperty('hpvrVoiceDiagnostics').orElse('false').get() == 'true'
if (hpvrVoiceDiagnostics && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new GradleException('Voice recording diagnostics cannot be included in release tasks.')
}

android {
    namespace 'io.github.hpvr.quest'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.hpvr.quest'
        minSdk 32
        targetSdk 35
        versionCode 85
        versionName '0.1.4'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                cppFlags '-std=c++20'
            }
        }
    }

    buildFeatures {
        prefab true
    }
    sourceSets {
        main.assets.srcDirs += [file('../../local/neural-voice-dependencies/assets')]
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libopenxr_loader.so']
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo', '-DHPVR_VOICE_DIAGNOSTICS=OFF'
                }
            }
        }
        // Separate artifact path: the local recording APK never replaces app-debug.apk.
        if (hpvrVoiceDiagnostics) {
            voiceDiagnostic {
                initWith debug
                matchingFallbacks = ['debug']
                versionNameSuffix '-voice-diag'
                externalNativeBuild {
                    cmake {
                        arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo', '-DHPVR_VOICE_DIAGNOSTICS=ON'
                    }
                }
            }
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            // Signing belongs to BUILD-QUEST-RELEASE.ps1, never Gradle secrets.
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release', '-DHPVR_VOICE_DIAGNOSTICS=OFF'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.43'
}
